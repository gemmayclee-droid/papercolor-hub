name: Build PaperColor firmware

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with FreeInk SDK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build M5Stack PaperColor
        run: pio run -e m5papercolor

      - name: Collect firmware files
        run: |
          mkdir -p dist
          cp .pio/build/m5papercolor/firmware.bin dist/papercolor-hub-firmware.bin
          cp .pio/build/m5papercolor/bootloader.bin dist/papercolor-hub-bootloader.bin
          cp .pio/build/m5papercolor/partitions.bin dist/papercolor-hub-partitions.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: papercolor-hub-${{ github.sha }}
          path: dist/
          if-no-files-found: error

